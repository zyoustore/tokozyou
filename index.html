<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYOU MARKET - Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background-color: #161618;
      border: 1px solid #28282c;
      border-radius: 12px;
      padding: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-logo {
      background-color: #f39c12;
      color: #000;
      font-weight: bold;
      font-size: 24px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
      color: #f39c12;
    }

    .brand-sub {
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 15px;
      border-bottom: 1px solid #28282c;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background-color: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #f39c12;
    }

    .btn-submit {
      width: 100%;
      background-color: #f39c12;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background-color: #e67e22;
    }

    .link-admin {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #f39c12;
      font-size: 13px;
      text-decoration: none;
    }

    .link-admin:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <div class="brand-logo">Z</div>
      <div>
        <div class="brand-title">ZYOU MARKET</div>
        <div class="brand-sub">ROBUX & GAMEPASS STORE</div>
      </div>
    </div>

    <h2>🛒 Form Order Pembeli</h2>

    <form id="orderForm">
      <div class="form-group">
        <label for="robloxUser">Roblox Username</label>
        <input type="text" id="robloxUser" placeholder="Masukkan Username Roblox..." required>
      </div>

      <div class="form-group">
        <label for="itemSelect">Pilih Item / Gamepass</label>
        <select id="itemSelect" required>
          <option value="">-- Pilih Item --</option>
          <option value="500 Robux Fast|72000">500 Robux Fast - Rp 72.000</option>
          <option value="Perm Buddha - Blox Fruits|165000">Perm Buddha - Blox Fruits - Rp 165.000</option>
          <option value="1000 Robux Fast|140000">1000 Robux Fast - Rp 140.000</option>
          <option value="Perm Dough - Blox Fruits|250000">Perm Dough - Blox Fruits - Rp 250.000</option>
        </select>
      </div>

      <div class="form-group">
        <label for="buktiTF">Link Bukti Transfer (Image URL / Drive)</label>
        <input type="url" id="buktiTF" placeholder="https://..." required>
      </div>

      <button type="submit" class="btn-submit">🚀 Kirim Orderan</button>
    </form>

    <a href="admin.html" target="_blank" class="link-admin">👉 Buka Dasbor Admin (Uji Coba)</a>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('robloxUser').value;
      const itemData = document.getElementById('itemSelect').value.split('|');
      const itemName = itemData[0];
      const itemPrice = parseInt(itemData[1]);
      const bukti = document.getElementById('buktiTF').value;

      // Ambil transaksi lama dari localStorage
      const transactions = JSON.parse(localStorage.getItem('transactions')) || [];

      // Buat No. Antrian unik (#ZY-xxxx)
      const newAntrian = "#ZY-" + Math.floor(1000 + Math.random() * 9000);

      // Buat objek order baru
      const newOrder = {
        id: newAntrian,
        robloxUser: username,
        item: itemName,
        price: itemPrice,
        bukti: bukti,
        status: "pending" // Status default
      };

      // Tambahkan transaksi baru ke paling atas
      transactions.unshift(newOrder);

      // Simpan kembali ke localStorage
      localStorage.setItem('transactions', JSON.stringify(transactions));

      alert('Orderan berhasil dikirim dengan Antrian ' + newAntrian + '! Silakan cek Dasbor Admin.');
      
      // Reset Form
      document.getElementById('orderForm').reset();
    });
  </script>

</body>
</html>
