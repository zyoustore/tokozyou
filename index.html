<!-- MODAL LOGIN & REGISTER USER -->
<div id="auth-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl relative z-10">
    <button type="button" onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
    
    <div class="flex gap-4 border-b border-slate-800 pb-3 mb-4">
      <button type="button" id="tab-login-btn" onclick="switchAuthTab('login')" class="font-extrabold text-sm text-indigo-400 border-b-2 border-indigo-500 pb-1">Login</button>
      <button type="button" id="tab-register-btn" onclick="switchAuthTab('register')" class="font-bold text-sm text-slate-400 hover:text-white pb-1">Daftar Akun Baru</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">Nomor HP atau Username</label>
        <input type="text" id="login-identifier" required placeholder="Contoh: 085767547693 / zyouuser" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Password</label>
        <input type="password" id="login-password" required placeholder="Masukkan password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 mt-2">
        Masuk Sekarang
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">Nama / Username Akun</label>
        <input type="text" id="reg-username" required placeholder="Contoh: Rian_Roblox" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Nomor WhatsApp / HP</label>
        <input type="text" id="reg-phone" required placeholder="Contoh: 081234567890" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Password</label>
        <input type="password" id="reg-password" required placeholder="Buat password baru" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/30 mt-2">
        Buat Akun Sekarang
      </button>
    </form>

  </div>
</div>
